name: echo_locate
description: "EchoLocate v2 — crowdsourced indoor mapping + navigation accessibility aid."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.11.0

# NOTE: Phase 1 dependency set. Phase 2/3 deps (tflite, flutter_gl, pdf,
# ARCore channel) are commented at the bottom and added when their phase starts.
# Versions may need a bump on first `flutter pub get`.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Presentation: Bloc ---
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # --- DI (service locator) ---
  get_it: ^7.7.0

  # --- Routing ---
  go_router: ^14.2.7

  # --- Local persistence (Achieve repo cache + offline) ---
  hive_ce: ^2.6.0
  hive_ce_flutter: ^2.1.0

  # --- Cloud / crowdsource ---
  supabase_flutter: ^2.6.0

  # --- Models ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # --- Design system ---
  google_fonts: ^6.2.1
  # --- Primary sense: camera + on-device ML Kit ---
  camera: ^0.11.0
  google_mlkit_object_detection: ^0.14.0
  google_mlkit_text_recognition: ^0.14.0

  # --- Acoustics (DSP ported from v1) ---
  fftea: ^1.5.0
  flutter_soloud: ^2.1.0
  # record: deferred — v5.1.2 pulls an incompatible record_linux 0.7.2
  #   (missing startStream from record_platform_interface 1.6.0, breaks the
  #   Android kernel snapshot). Re-add a verified version (or a record_linux
  #   dependency_override) when building the acoustic mic-capture feature.

  # --- Sensors / permissions / voice / utils ---
  sensors_plus: ^6.0.1
  permission_handler: ^11.3.1
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  logger: ^2.4.0
  phosphoricons_flutter: ^1.0.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  hive_ce_generator: ^1.7.0
  mocktail: ^1.0.4
  # bloc_test: re-add a freezed-compatible version when writing Bloc tests
  #   (current bloc_test pulls an analyzer range that conflicts with freezed).

flutter:
  uses-material-design: true

  assets:
    # Local secrets (gitignored — copy .env.example to .env and fill in).
    - .env

# --- Deferred to later phases (uncomment when the phase starts) ---
# Phase 2 (mapping/export):
#   pdf: ^3.11.1
#   printing: ^5.13.1
# Phase 3 (intelligence / 3D):
#   tflite_flutter: ^0.11.0
#   flutter_gl: ^0.0.x
